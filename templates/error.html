{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="error">
  <p class="muted">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p>{{ msg }}</p>
  <a class="btn" href="{{ url_for('identify') if me else url_for('login') }}">{{ t('go_home') if me else t('sign_in') }}</a>
</section>
{% endblock %}
