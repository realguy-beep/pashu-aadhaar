services:
  - type: web
    name: pashu-aadhaar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 1 worker so all requests share one in-memory registry; threads for concurrency
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
